<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Budget Calculator</title>
  <link rel="stylesheet" href="/personal calculator/style.css">
</head>
<body>
  <main class="card">
    <h1>Personal Budget Calculator</h1>

    <table>
      <thead>
        <tr><th>Expense</th><th>Amount</th></tr>
      </thead>
      <tbody id="expense-body"></tbody>
    </table>

    <div class="add-expense">
      <input type="text" id="expense-name" placeholder="Expense name">
      <input type="number" id="expense-amount" placeholder="Amount (KES)" min="0">
      <button id="add-btn">Add expense</button>
      <button id="reset-btn" class="secondary">Reset</button>
    </div>

    <section class="summary">
      <h2>Summary</h2>
      <p>Income: <strong id="income"></strong></p>
      <p>Total expenses: <strong id="total-expenses"></strong></p>
      <p>Remaining balance: <strong id="balance"></strong></p>
      <p>Savings: <strong id="savings"></strong></p>
      <p>Status: <strong id="status"></strong></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
